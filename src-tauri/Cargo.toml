[package]
name = "pgcove"
version = "0.1.0"
description = "Native Postgres/Supabase-first database client"
authors = ["xFarid6"]
license = "FSL-1.1-MIT"
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "pgcove_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# rustls TLS so Supabase (which requires TLS) works with zero native deps.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "sqlite", "json"] }
# Supabase HTTP APIs (issue #5). rustls here too — no native-tls/OpenSSL.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "charset", "json"] }
tokio = { version = "1", features = ["macros"] }
# Same keyring setup as proxmox-desktop / dockshell.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
